name: Build Windows Launcher Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-launcher:
    name: Package Windows Launcher
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[publish-launcher]')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout clean launcher repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release version and tag
        id: release_version
        shell: pwsh
        run: |
          $version = (Get-Content launcher_version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "launcher_version.txt must be a semantic version"
          }
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne ("v" + $version)) {
            throw "Tag $env:GITHUB_REF_NAME must match launcher_version.txt v$version"
          }
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install pinned Windows build dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Test updater safety (no game files)
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build and validate portable Windows app
        shell: pwsh
        env:
          CFR_BUILD_DIR: build
        run: ./release_tools/build_windows.ps1

      - name: Verify frozen EXE and updater process without showing UI
        shell: pwsh
        env:
          CFR_BUILD_DIR: build
        run: python release_tools/smoke_portable.py

      - name: Upload build artifacts for testing
        uses: actions/upload-artifact@v4
        with:
          name: Crash-Forge-Launcher-Windows
          path: |
            build/release/Crash-Forge-Launcher-Windows.zip
            build/release/Crash-Forge-Launcher-Windows.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.ref == 'refs/heads/main' &&
           contains(github.event.head_commit.message, '[publish-launcher]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Crash Forge Racing Launcher ${{ steps.release_version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          prerelease: false
          files: |
            build/release/Crash-Forge-Launcher-Windows.zip
            build/release/Crash-Forge-Launcher-Windows.zip.sha256


      - name: Attach news images to their exact release tags
        # No new release versions: replace image assets on existing tags.
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.ref == 'refs/heads/main' &&
           contains(github.event.head_commit.message, '[publish-launcher]'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($version in @("0.3.37", "0.3.38", "0.3.39")) {
            $file = Join-Path "assets/news" ("forge-news-v" + $version + ".webp")
            if (Test-Path -LiteralPath $file) {
              gh release upload ("v" + $version) $file --clobber --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) {
                throw "Could not replace existing-release artwork v$version"
              }
              # Put the illustration IN the existing release description;
              # keep the previous changelog intact and never create a new tag.
              $prior = gh release view ("v" + $version) --json body --jq ".body" --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) {
                throw "Could not read existing release notes v$version"
              }
              $body = $prior -join "`n"
              $filename = Split-Path $file -Leaf
              if (-not $body.Contains($filename)) {
                $caption = switch ($version) { "0.3.37" { "Forge Hub Website" } "0.3.38" { "Model Importer v1.8" } default { "Forge Hub Mod Manager" } }
                $art = "![Crash Forge " + $caption + "](https://github.com/" + $env:GITHUB_REPOSITORY + "/releases/download/v" + $version + "/" + $filename + ")"
                $notes = Join-Path $env:RUNNER_TEMP ("cfr-existing-release-v" + $version + ".md")
                [IO.File]::WriteAllText($notes, ($art + "`n`n" + $body), [Text.Encoding]::UTF8)
                gh release edit ("v" + $version) --notes-file $notes --repo $env:GITHUB_REPOSITORY
                if ($LASTEXITCODE -ne 0) {
                  throw "Could not update original release description v$version"
                }
              }
            }
          }

          $notes37 = "assets/news/v0.3.37-release-notes.md"
          if (Test-Path -LiteralPath $notes37) {
            gh release edit "v0.3.37" --notes-file $notes37 --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) {
              throw "Could not refresh original v0.3.37 description"
            }
          }

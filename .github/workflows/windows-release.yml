name: Build Windows Launcher Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-launcher:
    name: Package Windows Launcher
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[publish-launcher]')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout clean launcher repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release version and tag
        id: release_version
        shell: pwsh
        run: |
          $version = (Get-Content launcher_version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "launcher_version.txt must be a semantic version"
          }
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne ("v" + $version)) {
            throw "Tag $env:GITHUB_REF_NAME must match launcher_version.txt v$version"
          }
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install pinned Windows build dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Generate v0.3.52 NEWS from the original launcher Fondo.png
        shell: pwsh
        run: python release_tools/prepare_news_artwork.py

      - name: Test updater safety (no game files)
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build and validate portable Windows app
        shell: pwsh
        env:
          CFR_BUILD_DIR: build
        run: ./release_tools/build_windows.ps1

      - name: Verify portable ZIP and GUI executable integrity headlessly
        shell: pwsh
        env:
          CFR_BUILD_DIR: build
        run: python release_tools/ci_static_check.py

      - name: Upload build artifacts for testing
        uses: actions/upload-artifact@v4
        with:
          name: Crash-Forge-Launcher-Windows
          path: |
            build/release/Crash-Forge-Launcher-Windows.zip
            build/release/Crash-Forge-Launcher-Windows.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.ref == 'refs/heads/main' &&
           contains(github.event.head_commit.message, '[publish-launcher]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Crash Forge Racing Launcher ${{ steps.release_version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          prerelease: false
          files: |
            build/release/Crash-Forge-Launcher-Windows.zip
            build/release/Crash-Forge-Launcher-Windows.zip.sha256


      - name: Attach artwork to the current release only
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.ref == 'refs/heads/main' &&
           contains(github.event.head_commit.message, '[publish-launcher]'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content launcher_version.txt -Raw).Trim()
          $tag = "v" + $version
          $file = Join-Path "assets/news" ("forge-news-v" + $version + ".webp")
          if (-not (Test-Path -LiteralPath $file)) {
            throw "Missing image for current version $tag"
          }
          gh release upload $tag $file --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Could not attach current release image $tag" }
          $filename = Split-Path $file -Leaf
          $prior = gh release view $tag --json body --jq ".body" --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Could not read release body for $tag" }
          $body = $prior -join [Environment]::NewLine
          if (-not $body.Contains($filename)) {
            $art = "![Forge Hub account](https://github.com/" + $env:GITHUB_REPOSITORY + "/releases/download/" + $tag + "/" + $filename + ")"
            $notes = Join-Path $env:RUNNER_TEMP ("cfr-news-" + $version + ".md")
            [IO.File]::WriteAllText($notes, ($art + [Environment]::NewLine + [Environment]::NewLine + $body), [Text.Encoding]::UTF8)
            gh release edit $tag --notes-file $notes --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Could not attach current release description image $tag" }
          }

  release-notes-only:
    name: Update v0.3.44 changelog (no new release or ZIP)
    if: >-
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[changelog-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout corrected changelog
        uses: actions/checkout@v4
      - name: Update only existing release text
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(cat launcher_version.txt)" = "0.3.44"
          ! grep -qi 'level_99' RELEASE_NOTES.md
          ! grep -qi 'level_99' LAUNCHER_CHANGELOG.txt
          ! grep -qi 'level_99' assets/news/publications.json
          gh release edit v0.3.44 --notes-file RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"